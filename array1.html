<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>array sum and multipy</title>
</head>
<body>
    <script>
        let n=[9,14,2,7,38,135];
        let sum=0;
        let multi=1;
        for (let i=0;i<n.length;i++){
            sum+=n[i];
            multi*=n[i];
        }
        document.write("sum=" + sum, "<br>");
        document.write("Multiply=" + multi);
    </script>
</body>
</html>
