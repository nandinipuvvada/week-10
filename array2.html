<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>largest</title>
</head>
<body>
    <script>
        let p=[14,38,9,24,135];
        let max=0;
        for(let i=0;i<p.length;i++){
            if(max<p[i]){
                max=p[i];
            }
        }
        document.write("Max=",max)
    </script>
</script>
</body>
</html>
