<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions</title>
</head>
<body>
    <h2>JavaScript Functions</h2>
    <script>
        function add(a, b) {
            return a + b;
        }
        const greet = (name) => "Hello " + name;
        function square(num) {
            return num * num;
        }
        document.write("Addition = " + add(4, 2) + "<br>");
        document.write("Square = " + square(9) + "<br>");
        document.write(greet("Nandini"));
    </script>
</body>
</html>
